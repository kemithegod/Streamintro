<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Starting Soon – Goddess Kemi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0005;
    font-family: 'Cormorant Garamond', serif;
    color: #e8d5b7;
  }

  /* ── PHOTO TRIPTYCH ── */
  .photos {
    position: fixed;
    inset: 0;
    display: flex;
    gap: 0;
    width: 100vw;
    height: 100vh;
  }

  .photo-panel {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .photo-panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    filter: saturate(0.85) brightness(0.55);
    transition: filter 6s ease;
  }

  .photo-panel:hover img {
    filter: saturate(1.05) brightness(0.7);
  }

  /* vertical divider lines */
  .photo-panel::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, #c9a96e55, transparent);
  }
  .photo-panel:last-child::after { display: none; }

  /* vignette over photos */
  .vignette {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, #0a0005 100%),
      linear-gradient(to bottom, #0a0005 0%, transparent 15%, transparent 75%, #0a0005 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ── CONTENT LAYER ── */
  .content {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* EYEBROW */
  .eyebrow {
    letter-spacing: 0.35em;
    font-size: 13px;
    font-weight: 300;
    color: #c9a96e;
    text-transform: uppercase;
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 1s ease 0.4s forwards;
  }

  /* NAME */
  .name {
    font-family: 'Cinzel Decorative', serif;
    font-size: 72px;
    font-weight: 700;
    color: #f5ece0;
    letter-spacing: 0.1em;
    text-align: center;
    line-height: 1;
    opacity: 0;
    animation: fadeUp 1s ease 0.7s forwards;
    text-shadow: 0 0 60px #7a2d6644, 0 2px 4px #00000088;
  }

  /* DIVIDER */
  .divider {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 20px 0 22px;
    opacity: 0;
    animation: fadeUp 1s ease 1s forwards;
  }
  .divider-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, #c9a96e, transparent);
  }
  .divider-diamond {
    width: 6px; height: 6px;
    background: #c9a96e;
    transform: rotate(45deg);
  }

  /* TIMER */
  .timer-wrap {
    opacity: 0;
    animation: fadeUp 1s ease 1.2s forwards;
    text-align: center;
  }

  .timer-label {
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #9b7a52;
    margin-bottom: 8px;
  }

  .timer {
    font-family: 'Cinzel Decorative', serif;
    font-size: 86px;
    font-weight: 700;
    color: #f5ece0;
    letter-spacing: 0.05em;
    line-height: 1;
    text-shadow: 0 0 40px #7a2d6655;
    min-width: 4ch;
    display: inline-block;
    text-align: center;
  }

  .timer.urgent {
    color: #e87777;
    text-shadow: 0 0 40px #e8777755;
    animation: pulse 1s ease-in-out infinite;
  }

  /* TAGLINE */
  .tagline {
    margin-top: 28px;
    font-style: italic;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 0.12em;
    color: #a08060;
    opacity: 0;
    animation: fadeUp 1s ease 1.5s forwards;
  }

  /* ── CORNER DECO ── */
  .corner {
    position: fixed;
    width: 80px; height: 80px;
    z-index: 12;
    opacity: 0.45;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner-tl { top: 32px; left: 32px; }
  .corner-tr { top: 32px; right: 32px; transform: scaleX(-1); }
  .corner-bl { bottom: 32px; left: 32px; transform: scaleY(-1); }
  .corner-br { bottom: 32px; right: 32px; transform: scale(-1,-1); }

  /* ── SOCIAL STRIP ── */
  .social {
    position: fixed;
    bottom: 40px;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 12;
    display: flex;
    gap: 48px;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1s ease 2s forwards;
  }

  .social-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .social-platform {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #6b5038;
  }

  .social-handle {
    font-size: 14px;
    letter-spacing: 0.1em;
    color: #c9a96e;
  }

  .social-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #6b5038;
    margin-top: 2px;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
</style>
</head>

<script>
  const MINUTES = 5;
  let total = MINUTES * 60;
  const el = document.getElementById('timer');

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2,'0');
  }

  function tick() {
    el.textContent = fmt(total);
    if (total <= 60) el.classList.add('urgent');
    if (total <= 0) { el.textContent = 'live now'; el.classList.add('urgent'); return; }
    total--;
    setTimeout(tick, 1000);
  }

  tick();
</script>
